name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          # the suite is offline by design (tests/conftest.py enforces it);
          # make sure no stray env leaks in
          BINANCE_MODE: mock
          X402_MODE: mock
