# Deploy the three AlphaBazaar seller agents as public x402 services.
# https://render.com  →  New  →  Blueprint  →  point at this repo.
#
# Config is declarative: X402_MODE=live and the SELLER_*_PAY_TO recipient
# addresses (Base Sepolia — receiving addresses, not secrets) are set here, so a
# push redeploys the whole market. For base mainnet: bump X402_NETWORK and swap
# the addresses for ones you control.
services:
  - type: web
    name: alphabazaar-funding-scanner
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn sellers.funding_scanner:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: X402_MODE
        value: live
      - key: X402_NETWORK
        value: base-sepolia
      - key: SELLER_FUNDING_PAY_TO
        value: "0x584efd7B6E9eEAe51DC9f6e733C21565CaD4ba2b"

  - type: web
    name: alphabazaar-risk-analyzer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn sellers.risk_analyzer:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: X402_MODE
        value: live
      - key: X402_NETWORK
        value: base-sepolia
      - key: SELLER_RISK_PAY_TO
        value: "0xfEa26142E1E597Cbe964815a7F24711b562ce121"

  - type: web
    name: alphabazaar-momentum-scanner
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn sellers.momentum_scanner:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: X402_MODE
        value: live
      - key: X402_NETWORK
        value: base-sepolia
      - key: SELLER_MOMENTUM_PAY_TO
        value: "0x584efd7B6E9eEAe51DC9f6e733C21565CaD4ba2b"
